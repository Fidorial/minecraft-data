   packet_set_player_team:
      team: string
      mode: i8 =>
         0: add
         1: remove
         2: change
         3: join
         4: leave
      # Parameters restructured: separate playerPrefix/playerSuffix (were combined via
      # prefix/suffix, unchanged in spirit); nameTagVisibility/collisionRule now their own
      # top-level mapped fields instead of packed with formatting; color is now an
      # Optional<TeamColor> (leading bool + TeamColor varint) instead of a raw `formatting` varint;
      # the old two-flag `flags` bitflags block is now a plain `options` byte (same two bits:
      # bit0=friendly_fire, bit1=see_friendly_invisibles).
      _: mode ?
         if add:
            displayName: anonymousNbt
            playerPrefix: anonymousNbt
            playerSuffix: anonymousNbt
            nameTagVisibility: TeamVisibility
            collisionRule: TeamCollisionRule
            hasColor: bool
            color: hasColor ?
               if true: TeamColor
               default: void
            options: u8
         if change:
            displayName: anonymousNbt
            playerPrefix: anonymousNbt
            playerSuffix: anonymousNbt
            nameTagVisibility: TeamVisibility
            collisionRule: TeamCollisionRule
            hasColor: bool
            color: hasColor ?
               if true: TeamColor
               default: void
            options: u8
         default: void
      players: mode ?
         if add: string[]varint
         if join: string[]varint
         if leave: string[]varint
         default: void
