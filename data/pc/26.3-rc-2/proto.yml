   # ResolvableInt (net.minecraft.world.level.storage.loot.providers.number.ints.ResolvableInt):
   # ByteBufCodecs.either(Constant.STREAM_CODEC, Reference.STREAM_CODEC) - a leading bool
   # (true=left=Constant, false=right=Reference), matching ByteBufCodecs.either's read/write.
   # Constant wraps a raw i32 (ByteBufCodecs.INT, NOT varint). Reference wraps a ResourceKey,
   # which serializes as a plain namespaced-identifier string (same as ResourceKey.streamCodec
   # elsewhere in this codebase, e.g. ChunkPos's dimension field convention).
   ResolvableInt:
      isConstant: bool
      value: isConstant ?
         if true: i32
         default: string
   # ResolvableFloat (net.minecraft.world.level.storage.loot.providers.number.floats.ResolvableFloat):
   # identical shape to ResolvableInt, but Constant wraps a raw f32 instead of i32.
   ResolvableFloat:
      isConstant: bool
      value: isConstant ?
         if true: f32
         default: string
   # DataComponentPatch (net.minecraft.core.component.DataComponentPatch) - now CONFIRMED from
   # source (was previously modeled by structural analogy only). decode(): positiveCount(varint),
   # negativeCount(varint), then `positiveCount` entries of {type via DataComponentType.STREAM_CODEC,
   # value via that type's own streamCodec()}, then `negativeCount` entries of {type only}. This is
   # exactly the same shape already used by Slot/UntrustedSlot's own added/removed component arrays,
   # confirming that guess. `type` is presumed to draw from the same DATA_COMPONENT_TYPE registry
   # index space already enumerated as SlotComponentType (DataComponentType.STREAM_CODEC is not
   # independently confirmed, but every other DataComponentType<Holder<X>> field seen so far -
   # Item.STREAM_CODEC, BlockTransformer, DecoratedPotPatterns - is a plain ByteBufCodecs.holderRegistry
   # varint, so reusing SlotComponentType/SlotComponent here is well-precedented, not a fresh guess).
   DataComponentPatch:
      positiveCount: varint
      negativeCount: varint
      added: SlotComponent[]$positiveCount
      removed: []$negativeCount
                  type: SlotComponentType
   # ItemStackTemplate (net.minecraft.world.item.ItemStackTemplate), used by SulfurCubeContent:
   # StreamCodec.composite(Item.STREAM_CODEC, item, VAR_INT, count, DataComponentPatch.STREAM_CODEC,
   # components, new). Fully confirmed from source: Item.STREAM_CODEC =
   # ByteBufCodecs.holderRegistry(Registries.ITEM), i.e. a plain registry-index varint, consistent
   # with how Slot.itemId is already modeled in this file; `components` uses the confirmed
   # DataComponentPatch type above. No remaining placeholders in this component chain
   # (sulfur_cube_content -> ItemStackTemplate -> item/count/components) - all fields confirmed.
   ItemStackTemplate:
      item: varint
      count: varint
      components: DataComponentPatch
   # SignText (net.minecraft.world.level.block.entity.SignText) - shared by sign_text_front and
   # sign_text_back, both DataComponentType<SignText>. Confirmed from source:
   # StreamCodec.composite(messages: fixedSizeList(4) of Component, filteredMessages:
   # Optional<fixedSizeList(4)>, color: DyeColor, hasGlowingText: bool). Components use the same
   # anonymousNbt convention already used elsewhere in this file for ComponentSerialization
   # fields (custom_name, item_name, lore, etc).
   SignTextData:
      messages: [
         "array",
         {
            "count": 4,
            "type": "anonymousNbt"
         }
      ]
      hasFilteredMessages: bool
      filteredMessages: hasFilteredMessages ?
         if true: [
            "array",
            {
               "count": 4,
               "type": "anonymousNbt"
            }
         ]
         default: void
      color: DyeColor
      hasGlowingText: bool
   UntrustedSlotComponent:
