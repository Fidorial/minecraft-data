^play.toServer.types:
   packet_accept_teleportation:
      teleportId: varint
   packet_attack:
      entityId: varint
   packet_block_entity_tag_query:
      transactionId: varint
      location: position
   packet_bundle_item_selected:
      slotId: varint
      selectedItemIndex: varint
   packet_change_difficulty:
      newDifficulty: varint =>
         0: peaceful
         1: easy
         2: normal
         3: hard
   packet_change_game_mode:
      mode: varint =>
         0: survival
         1: creative
         2: adventure
         3: spectator
   packet_chat_ack:
      count: varint
   packet_chat_command:
      command: string
   packet_chat_command_signed:
      command: string
      timestamp: i64
      salt: i64
      argumentSignatures: []varint
                             argumentName: string
                             signature: [
                                "buffer",
                                {
                                   "count": 256
                                }
                             ]
      messageCount: varint
      acknowledged: [
         "buffer",
         {
            "count": 3
         }
      ]
      checksum: u8
   packet_chat:
      message: string
      timestamp: i64
      salt: i64
      signature?: [
         "buffer",
         {
            "count": 256
         }
      ]
      offset: varint
      acknowledged: [
         "buffer",
         {
            "count": 3
         }
      ]
      checksum: u8
   packet_chat_session_update:
      sessionUUID: UUID
      expireTime: i64
      publicKey: ByteArray
      signature: ByteArray
   packet_chunk_batch_received:
      chunksPerTick: f32
   packet_client_command:
      actionId: varint =>
         0: perform_respawn
         1: request_stats
         2: request_gamerule_values
   packet_client_tick_end:
      # Empty
   packet_command_suggestion:
      transactionId: varint
      text: string
   packet_configuration_acknowledged:
      # Empty
   packet_container_button_click:
      windowId: ContainerID
      enchantment: varint
   packet_container_click:
      windowId: ContainerID
      stateId: varint
      slot: i16
      mouseButton: i8
      mode: varint
      changedSlots: []varint
                       location: i16
                       item?: HashedSlot
      cursorItem?: HashedSlot
   packet_container_close:
      windowId: ContainerID
   packet_container_slot_state_changed:
      slot_id: varint
      window_id: ContainerID
      state: bool
   packet_custom_payload:
      channel: string
      data: restBuffer
   packet_debug_subscription_request:
      subscriptions: DebugSubscriptionDataType[]varint
   packet_edit_book:
      hand: varint
      pages: string[]varint
      title?: string
   packet_entity_tag_query:
      transactionId: varint
      entityId: varint
   packet_interact:
      target: varint
      hand: varint =>
         0: main_hand
         1: off_hand
      location: lpVec3
      sneaking: bool
   packet_jigsaw_generate:
      location: position
      levels: varint
      keepJigsaws: bool
   packet_keep_alive:
      keepAliveId: i64
   packet_lock_difficulty:
      locked: bool
   MovementFlags: [
      "bitflags",
      {
         "type": "u8",
         "flags": [
            "onGround",
            "hasHorizontalCollision"
         ]
      }
   ]
   packet_move_player_pos:
      x: f64
      y: f64
      z: f64
      flags: MovementFlags
   packet_move_player_pos_rot:
      x: f64
      y: f64
      z: f64
      yaw: f32
      pitch: f32
      flags: MovementFlags
   packet_move_player_rot:
      yaw: f32
      pitch: f32
      flags: MovementFlags
   packet_move_player_status_only:
      flags: MovementFlags
   packet_move_vehicle:
      x: f64
      y: f64
      z: f64
      yaw: f32
      pitch: f32
      onGround: bool
   packet_paddle_boat:
      leftPaddle: bool
      rightPaddle: bool
   packet_pick_item_from_block:
      position: position
      includeData: bool
   packet_pick_item_from_entity:
      entityId: varint
      includeData: bool
   packet_ping_request:
      id: i64
   packet_place_recipe:
      windowId: ContainerID
      recipeId: varint
      makeAll: bool
   packet_player_abilities:
      flags: i8
   packet_player_action:
      status: varint
      location: position
      face: i8
      sequence: varint
   packet_player_command:
      entityId: varint
      actionId: varint =>
         0: leave_bed
         1: start_sprinting
         2: stop_sprinting
         3: start_horse_jump
         4: stop_horse_jump
         5: open_vehicle_inventory
         6: start_elytra_flying
      jumpBoost: varint
   packet_player_input:
      inputs: [
         "bitflags",
         {
            "type": "u8",
            "flags": [
               "forward",
               "backward",
               "left",
               "right",
               "jump",
               "shift",
               "sprint"
            ]
         }
      ]
   packet_player_loaded:
      # Empty
   packet_pong:
      id: i32
   packet_recipe_book_change_settings:
      bookId: varint
      bookOpen: bool
      filterActive: bool
   packet_recipe_book_seen_recipe:
      recipeId: varint
   packet_rename_item:
      name: string
   packet_resource_pack:
      uuid: UUID
      result: varint
   packet_seen_advancements:
      action: varint
      tabId: action ?
         if 0: string
         if 1: void
   packet_select_trade:
      slot: varint
   packet_set_beacon:
      primary_effect?: varint
      secondary_effect?: varint
   packet_set_carried_item:
      slotId: i16
   packet_set_command_block:
      location: position
      command: string
      mode: varint
      flags: u8
   packet_set_command_minecart:
      entityId: varint
      command: string
      track_output: bool
   packet_set_creative_mode_slot:
      slot: i16
      item: UntrustedSlot
   packet_set_game_rule:
      entries: GameRule[]varint
   packet_set_jigsaw_block:
      location: position
      name: string
      target: string
      pool: string
      finalState: string
      jointType: string
      selection_priority: varint
      placement_priority: varint
   packet_set_structure_block:
      location: position
      action: varint
      mode: varint
      name: string
      offset_x: i8
      offset_y: i8
      offset_z: i8
      size_x: i8
      size_y: i8
      size_z: i8
      mirror: varint
      rotation: varint
      metadata: string
      integrity: f32
      seed: varint
      flags: u8 =>
         0: ignore_entities
         1: show_air
         2: show_bounding_box
         3: strict
   packet_set_test_block:
      position: position
      mode: varint
      message: string
   packet_sign_update:
      location: position
      isFrontText: bool
      text1: string
      text2: string
      text3: string
      text4: string
   packet_teleport_to_entity:
      entityId: varint
   # Renamed from arm_animation. Body is now EMPTY (StreamCodec.unit) - the old `hand` field is
   # gone entirely; hand is presumably now inferred/unused server-side.
   packet_punch:
      # Empty
   packet_spectator_action:
      target: UUID
   packet_test_instance_block_action:
      pos: position
      action: varint
      data:
         test?: string
         size: vec3i
         rotation: varint
         ignoreEntities: bool
         status: varint
         errorMessage?: anonymousNbt
   packet_use_item_on:
      hand: varint
      location: position
      direction: varint
      cursorX: f32
      cursorY: f32
      cursorZ: f32
      insideBlock: bool
      worldBorderHit: bool
      sequence: varint
   packet_use_item:
      hand: varint
      sequence: varint
      rotation: vec2f
   packet:
      name: varint =>
         0x00: accept_teleportation
         0x01: attack
         0x02: block_entity_tag_query
         0x03: bundle_item_selected
         0x04: change_difficulty
         0x05: change_game_mode
         0x06: chat_ack
         0x07: chat_command
         0x08: chat_command_signed
         0x09: chat
